name: Validar código (reglas de AGENTS.md)

# Revisa las reglas fijas de AGENTS.md en las líneas que agrega cada PR de código
# (issue citada, pruebas, pantallas que solo hablan con los puertos, TypeScript
# estricto, secretos y datos personales) y deja un comentario en el PR.
# Complementa al CI (lint, pruebas y build); no lo sustituye.
#
# Seguridad: usa pull_request_target para poder comentar en PR de forks. NUNCA hace
# checkout del código del PR ni lo ejecuta: lee los cambios como texto por la API.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'contracts/**'

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: validar-codigo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validar:
    name: Reglas fijas de AGENTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Traer el script de validación (de main, no del PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Revisar el PR y comentar
        uses: actions/github-script@v7
        with:
          script: |
            const { validarCodigo, formatearCodigo, issuesCitadas, MARCA_CODIGO } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/validar-codigo.mjs`);
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const archivos = (await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 }))
              .map((f) => ({ path: f.filename, status: f.status, patch: f.patch }));

            let packageJson = null;
            try {
              const { data } = await github.rest.repos.getContent({ owner: pr.head.repo.owner.login, repo: pr.head.repo.name, path: 'package.json', ref: pr.head.sha });
              packageJson = Buffer.from(data.content, 'base64').toString('utf8');
            } catch { packageJson = null; }

            const issues = [];
            for (const n of issuesCitadas(pr.body)) {
              try {
                const { data: i } = await github.rest.issues.get({ owner, repo, issue_number: n });
                if (!i.pull_request) issues.push({ number: i.number, title: i.title, state: i.state, assignees: (i.assignees || []).map((a) => a.login) });
              } catch { /* la issue no existe */ }
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: pr.number, per_page: 100 });
            const revisiones = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });

            const resultado = validarCodigo({
              prBody: pr.body || '',
              archivos,
              packageJson,
              issues,
              autor: pr.user.login,
              autoresCommits: commits.map((c) => c.author?.login || ''),
              revisiones: revisiones.map((r) => ({ login: r.user?.login || '', state: r.state })),
            });
            const { cumple, texto } = formatearCodigo(resultado);

            const comentarios = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
            const previo = comentarios.find((c) => c.user?.type === 'Bot' && c.body?.includes(MARCA_CODIGO));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: texto });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: texto });

            await core.summary.addRaw(texto).write();
            if (!cumple) core.setFailed('El PR no cumple las reglas fijas de AGENTS.md. Revisa el comentario en el PR.');
