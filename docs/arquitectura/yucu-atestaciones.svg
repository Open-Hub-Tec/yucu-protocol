<svg viewBox="0 0 1200 780" role="img" xmlns="http://www.w3.org/2000/svg" width="1200" height="780" aria-label="Motor de atestaciones sobre Attest Protocol: la persona habla o escribe; el motor transcribe, arma un borrador solo con los campos del manifiesto del esquema y lo lee en voz alta; ella confirma y firma en su dispositivo, y un patrocinador puede pagar la comisión; Attest Protocol, la base auditada, guarda la atestación y llama al índice de Yucu, que guarda listas y contadores y consulta las reglas del esquema; el verificador conversacional, otros contratos, la pantalla de la artesana y los agentes de IA leen la red directamente, sin indexador. La IA prepara y nunca firma. En la cadena solo van hashes con sal, direcciones y fechas.">
<style>
.band { fill: #E8EAF1; }
.bl { fill: #586078; font: 600 10.5px 'Source Sans 3','Segoe UI',system-ui,sans-serif; letter-spacing: .14em; }
.box { fill: #FFFFFF; stroke: #B9BED0; stroke-width: 1.4; }
.box.todo { stroke-dasharray: 6 4; }
.box.new { fill: #E1E7F8; stroke: #2C4799; }
.box.ext { fill: #F5EAD0; stroke: #9A6A0C; }
.t { fill: #1B1F2E; font: 700 13.5px 'Source Sans 3','Segoe UI',system-ui,sans-serif; }
.p { fill: #1B1F2E; font: 600 13px 'Source Sans 3','Segoe UI',system-ui,sans-serif; }
.s { fill: #586078; font: 400 12px 'Source Sans 3','Segoe UI',system-ui,sans-serif; }
.m { fill: #586078; font: 400 11px 'JetBrains Mono',ui-monospace,Menlo,monospace; }
.tag { font: 700 10px 'Source Sans 3','Segoe UI',system-ui,sans-serif; letter-spacing: .08em; fill: #586078; }
.tag.new, .s.new { fill: #2C4799; }
.tag.ext { fill: #9A6A0C; }
.warn { fill: #A8213C; font: 700 11.5px 'Source Sans 3','Segoe UI',system-ui,sans-serif; }
.ar { stroke: currentColor; stroke-width: 1.4; fill: none; }
.ar.dash { stroke-dasharray: 5 4; }
.al { fill: #1B1F2E; font: 600 11px 'Source Sans 3','Segoe UI',system-ui,sans-serif; }
 svg{color:#1B1F2E}</style>
<rect width="1200" height="780" fill="#FFFFFF"/>
<g color="#1B1F2E">
          <defs>
            <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker>
          </defs>

          <!-- Bandas -->
          <rect class="band" x="10" y="10" width="1170" height="80" rx="10"/>
          <rect class="band" x="10" y="106" width="1170" height="104" rx="10"/>
          <rect class="band" x="10" y="226" width="1170" height="104" rx="10"/>
          <rect class="band" x="10" y="346" width="1170" height="190" rx="10"/>
          <rect class="band" x="10" y="552" width="1170" height="138" rx="10"/>
          <rect class="band" x="10" y="706" width="1170" height="64" rx="10"/>
          <text class="bl" text-anchor="middle" transform="translate(27 50) rotate(-90)">HABLAN</text>
          <text class="bl" text-anchor="middle" transform="translate(27 158) rotate(-90)">MOTOR</text>
          <text class="bl" text-anchor="middle" transform="translate(27 278) rotate(-90)">FIRMAN</text>
          <text class="bl" text-anchor="middle" transform="translate(27 441) rotate(-90)">EN STELLAR</text>
          <text class="bl" text-anchor="middle" transform="translate(27 621) rotate(-90)">LEEN</text>
          <text class="bl" text-anchor="middle" transform="translate(27 738) rotate(-90)">DATOS</text>

          <!-- Quienes emiten -->
          <text class="p" x="175" y="40" text-anchor="middle">Artesana</text>
          <text class="s" x="175" y="60" text-anchor="middle">su consentimiento · sus lotes</text>
          <text class="p" x="457" y="40" text-anchor="middle">Grupo o cooperativa</text>
          <text class="s" x="457" y="60" text-anchor="middle">origen comunitario · tránsito</text>
          <text class="p" x="739" y="40" text-anchor="middle">Marca</text>
          <text class="s" x="739" y="60" text-anchor="middle">colaboración, si hay consentimiento</text>
          <text class="p" x="1021" y="40" text-anchor="middle">Otro negocio</text>
          <text class="s" x="1021" y="60" text-anchor="middle">solo escribe su manifiesto (ADR-007 D7)</text>
          <line class="ar" x1="175" y1="70" x2="175" y2="119" marker-end="url(#ah2)"/>
          <line class="ar" x1="457" y1="70" x2="380" y2="119" marker-end="url(#ah2)"/>
          <line class="ar" x1="739" y1="70" x2="560" y2="119" marker-end="url(#ah2)"/>
          <line class="ar dash" x1="1021" y1="70" x2="1021" y2="119" marker-end="url(#ah2)"/>

          <!-- Motor -->
          <rect class="box new" x="44" y="122" width="726" height="74" rx="8"/>
          <text class="t" x="64" y="144">Motor de voz y texto</text>
          <text class="tag new" x="226" y="144">NUEVO · ADR-007 D2 · #154 · #155</text>
          <text class="s" x="64" y="164">transcribe → borrador solo con los campos del manifiesto → lo lee en voz alta: «¿Es correcto?»</text>
          <text class="warn" x="64" y="184">La IA prepara y explica; nunca firma ni certifica</text>

          <rect class="box new" x="786" y="122" width="366" height="74" rx="8"/>
          <text class="t" x="806" y="144">Manifiesto del esquema</text>
          <text class="tag new" x="1136" y="144" text-anchor="end">ADR-007 D1 · #140</text>
          <text class="s" x="806" y="164">cada campo: público · solo hash · prohibido</text>
          <text class="s" x="806" y="182">voz por idioma · quién firma · hash en el esquema</text>
          <line class="ar" x1="786" y1="159" x2="773" y2="159" marker-end="url(#ah2)"/>
          <text class="al" x="778" y="116" text-anchor="middle">guía</text>

          <line class="ar" x1="234" y1="196" x2="234" y2="239" marker-end="url(#ah2)"/>
          <text class="al" x="242" y="222">confirmó</text>

          <!-- Firma -->
          <rect class="box" x="44" y="242" width="380" height="74" rx="8"/>
          <text class="t" x="234" y="264" text-anchor="middle">Firma en su propio dispositivo</text>
          <text class="s" x="234" y="282" text-anchor="middle">require_auth · llave del teléfono, tarjeta QR o Freighter</text>
          <text class="s" x="234" y="300" text-anchor="middle">nadie firma por ella</text>

          <rect class="box todo" x="440" y="242" width="330" height="74" rx="8"/>
          <text class="t" x="605" y="264" text-anchor="middle">Patrocinador (opcional)</text>
          <text class="s" x="605" y="282" text-anchor="middle">envía y paga la comisión, sin BLS</text>
          <text class="s" x="605" y="300" text-anchor="middle">no puede cambiar lo firmado · #94 · Attest #127</text>

          <rect class="box todo" x="786" y="242" width="366" height="74" rx="8"/>
          <text class="t" x="969" y="264" text-anchor="middle">Fuera de la cadena</text>
          <text class="s" x="969" y="282" text-anchor="middle">firma SEP-53 · muchas en una raíz de Merkle</text>
          <text class="s" x="969" y="300" text-anchor="middle">sin conexión (#21); solo llaves de una firma</text>

          <line class="ar" x1="234" y1="316" x2="234" y2="359" marker-end="url(#ah2)"/>
          <text class="al" x="242" y="342">attest · revoke</text>
          <line class="ar dash" x1="605" y1="316" x2="380" y2="359" marker-end="url(#ah2)"/>
          <line class="ar dash" x1="969" y1="316" x2="404" y2="380" marker-end="url(#ah2)"/>
          <text class="al" x="740" y="342">una atestación con la raíz</text>

          <!-- Attest Protocol -->
          <rect class="box ext" x="44" y="362" width="360" height="158" rx="8"/>
          <text class="t" x="64" y="386">Attest Protocol</text>
          <text class="tag ext" x="64" y="403">EXTERNO · BASE AUDITADA · v2 EN MAINNET</text>
          <text class="s" x="64" y="426">esquemas · atestaciones · revocación</text>
          <text class="s" x="64" y="444">vencimiento · IDs calculados en el contrato</text>
          <text class="s" x="64" y="462">solo el emisor revoca</text>
          <text class="m" x="64" y="484">v3: attest_for · is_valid_for</text>
          <text class="m" x="64" y="502">extend_ttl · esquemas persistent</text>

          <!-- Attest ↔ índice -->
          <line class="ar" x1="404" y1="418" x2="467" y2="418" marker-end="url(#ah2)"/>
          <text class="al" x="436" y="408" text-anchor="middle">onattest</text>
          <line class="ar" x1="404" y1="452" x2="467" y2="452" marker-end="url(#ah2)"/>
          <text class="al" x="436" y="442" text-anchor="middle">onrevoke</text>
          <text class="al" x="436" y="472" text-anchor="middle">sí / no</text>

          <!-- Índice -->
          <rect class="box new" x="470" y="362" width="380" height="158" rx="8"/>
          <text class="t" x="490" y="386">Índice de Yucu</text>
          <text class="tag new" x="490" y="403">NUEVO · SIN ADMINISTRADOR · PARA CUALQUIER PROYECTO</text>
          <text class="s" x="490" y="426">listas por lote, por emisor y por cuenta</text>
          <text class="s" x="490" y="444">contadores por esquema: emitidas y revocadas</text>
          <text class="s" x="490" y="462">solo acepta llamadas de Attest Protocol</text>
          <text class="s" x="490" y="480">pasa a las reglas el estado del ref_uid</text>
          <text class="m" x="490" y="502">ADR-005 D2 · sin indexador</text>

          <!-- Índice ↔ reglas -->
          <line class="ar" x1="850" y1="418" x2="883" y2="418" marker-end="url(#ah2)"/>
          <line class="ar" x1="883" y1="452" x2="853" y2="452" marker-end="url(#ah2)"/>

          <!-- Reglas -->
          <rect class="box todo" x="886" y="362" width="266" height="158" rx="8"/>
          <text class="t" x="904" y="386">Reglas por esquema</text>
          <text class="tag" x="904" y="403">POR CONSTRUIR · D5</text>
          <text class="s" x="904" y="426">origen: solo grupos dados de alta</text>
          <text class="s" x="904" y="444">colaboración: exige consentimiento</text>
          <text class="s" x="904" y="462">cofirma · corte por llave robada</text>
          <text class="s" x="904" y="480">admin multifirma declarado</text>
          <text class="s" x="904" y="502">otro proyecto: sus propias reglas</text>

          <!-- Stellar → lectores -->
          <line class="ar" x1="175" y1="520" x2="175" y2="565" marker-end="url(#ah2)"/>
          <text class="al" x="183" y="546">RPC directo</text>
          <line class="ar" x1="457" y1="520" x2="457" y2="565" marker-end="url(#ah2)"/>
          <text class="al" x="465" y="546">is_valid_for · índice</text>
          <line class="ar" x1="660" y1="520" x2="739" y2="565" marker-end="url(#ah2)"/>
          <text class="al" x="712" y="540">listas</text>
          <line class="ar" x1="830" y1="520" x2="1000" y2="565" marker-end="url(#ah2)"/>

          <!-- Lectores -->
          <rect class="box new" x="44" y="568" width="262" height="106" rx="8"/>
          <text class="t" x="175" y="592" text-anchor="middle">Verificador conversacional</text>
          <text class="s" x="175" y="612" text-anchor="middle">contesta solo con atestaciones</text>
          <text class="s" x="175" y="630" text-anchor="middle">y cita cada una · #142</text>
          <text class="s" x="175" y="648" text-anchor="middle">vigente · revocada · vencida · archivada</text>
          <text class="warn" x="175" y="666" text-anchor="middle">«eso no está probado»</text>

          <rect class="box" x="326" y="568" width="262" height="106" rx="8"/>
          <text class="t" x="457" y="592" text-anchor="middle">Otros contratos</text>
          <text class="s" x="457" y="612" text-anchor="middle">perpetual_royalties: procedencia</text>
          <text class="s" x="457" y="630" text-anchor="middle">comprueban esquema y sujeto,</text>
          <text class="s" x="457" y="648" text-anchor="middle">no solo «vigente» · W17 #110</text>

          <rect class="box new" x="608" y="568" width="262" height="106" rx="8"/>
          <text class="t" x="739" y="592" text-anchor="middle">Pantalla de la artesana</text>
          <text class="s" x="739" y="612" text-anchor="middle">ve lo que se dice de sus lotes</text>
          <text class="s" x="739" y="630" text-anchor="middle">revoca su consentimiento:</text>
          <text class="s" x="739" y="648" text-anchor="middle">ella lo emitió (ADR-005 D6)</text>
          <text class="m" x="739" y="666" text-anchor="middle">W36 #148</text>

          <rect class="box new todo" x="890" y="568" width="262" height="106" rx="8"/>
          <text class="t" x="1021" y="592" text-anchor="middle">Agentes de IA (MCP)</text>
          <text class="s" x="1021" y="612" text-anchor="middle">verificar · listar · explicar_esquema</text>
          <text class="s" x="1021" y="630" text-anchor="middle">preparar_atestacion sin firmar</text>
          <text class="s" x="1021" y="648" text-anchor="middle">de compradores, tiendas y marcas</text>
          <text class="m" x="1021" y="666" text-anchor="middle">ADR-007 D5</text>

          <!-- Datos -->
          <text class="s" x="64" y="734">En la cadena: hashes con sal aleatoria, direcciones G…, IDs y fechas. El manifiesto de cada esquema es un JSON público ligado por su hash.</text>
          <text class="warn" x="64" y="754">Nunca nombres, teléfonos ni coordenadas. El audio no se guarda.</text>
        </g>
</svg>
